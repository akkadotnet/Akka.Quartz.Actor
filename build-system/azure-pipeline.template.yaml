parameters:
  name: ''
  displayName: ''
  vmImage: ''
  outputDirectory: ''
  artifactName: ''
  timeoutInMinutes: 120

jobs:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}

    pool:
      vmImage: ${{ parameters.vmImage }}

    steps:
      - checkout: self  # self represents the repo where the initial Pipelines YAML file was found
        clean: false  # whether to fetch clean each time
        submodules: recursive  # set to 'true' for a single level of submodules or 'recursive' to get submodules of submodules
        persistCredentials: true

      - task: UseDotNet@2
        displayName: 'Use .NET'
        inputs:
          packageType: 'sdk'
          useGlobalJson: true

      - pwsh: |
          $globalJsonPath = Join-Path $env:BUILD_SOURCESDIRECTORY 'global.json'
          $sdkVersion = (Get-Content $globalJsonPath -Raw | ConvertFrom-Json).sdk.version
          if (-not $sdkVersion) { throw "Could not read sdk.version from $globalJsonPath" }
          $majorVersion = $sdkVersion.Split('.')[0]
          $runtimeVersion = $majorVersion + '.x'
          Write-Host "Resolved .NET runtime '$runtimeVersion' from global.json SDK version '$sdkVersion'"
          Write-Host "##vso[task.setvariable variable=DotNetRuntimeVersion]$runtimeVersion"
        displayName: 'Resolve .NET runtime version from global.json'

      - task: UseDotNet@2
        displayName: 'Use .NET runtime from global.json'
        inputs:
          packageType: runtime
          version: $(DotNetRuntimeVersion)

      - script: dotnet tool restore
        displayName: 'Restore dotnet tools'

      - pwsh: |
          .\build.ps1
        displayName: 'Update Release Notes'
        continueOnError: false

      - script: dotnet build -c Release
        displayName: 'dotnet build'
        continueOnError: false

      - pwsh: |
          ./scripts/tests/runTests.Tests.ps1
          $excludeDatabaseTests = '$(Agent.OS)' -ne 'Linux'
          ./scripts/runTests.ps1 -ExcludeDatabaseTests:$excludeDatabaseTests -ResultsDirectory "$(Build.SourcesDirectory)/TestResults/$(Build.BuildId)"
        displayName: 'Run tests'

      # Seeds a real Akka.Quartz.Actor 1.5.59 / Quartz 3 store and upgrades it by following the guide.
      - script: |
          set -e
          examples/upgrade-walkthrough/run-walkthrough.sh "$(Agent.TempDirectory)/walkthrough-binary" binary
          examples/upgrade-walkthrough/run-walkthrough.sh "$(Agent.TempDirectory)/walkthrough-json" json
        displayName: 'Run the upgrade guide walkthrough'
        condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: 'TestResults/$(Build.BuildId)/**/*.trx'
          testRunTitle: ${{ parameters.name }}
          mergeTestResults: true
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
          publishRunAttachments: true

      - pwsh: |
          $coverageFiles = Get-ChildItem -Path "$(Build.SourcesDirectory)/TestResults" -Filter "*.cobertura.xml" -Recurse
          $hasCoverageFiles = $coverageFiles.Count -gt 0
          Write-Host "##vso[task.setvariable variable=HasCoverageFiles]$hasCoverageFiles"
        displayName: 'Check for Coverage Files'
        condition: always()
        continueOnError: true

      - task: reportgenerator@5
        displayName: ReportGenerator
        # Only run if coverage files exist
        condition: and(always(), eq(variables['HasCoverageFiles'], 'True'))
        continueOnError: true
        inputs:
          reports: '$(Build.SourcesDirectory)/TestResults/**/*.cobertura.xml'
          targetdir: '$(Build.SourcesDirectory)/coveragereport'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura;Badges'
          assemblyfilters: '-xunit*'
          publishCodeCoverageResults: true

      - publish: $(Build.SourcesDirectory)/coveragereport
        displayName: 'Publish Coverage Report'
        # Only run if coverage files exist
        condition: and(always(), eq(variables['HasCoverageFiles'], 'True'))
        continueOnError: true
        artifact: 'CoverageReports-$(Agent.OS)-$(Build.BuildId)'

      - script: dotnet pack -c Release --no-build -o $(Build.ArtifactStagingDirectory)/nuget
        displayName: 'Create packages'

      - pwsh: ./scripts/publishUpgradeTools.ps1 -OutputDirectory "$(Build.ArtifactStagingDirectory)/upgrade-tools"
        displayName: 'Publish standalone upgrade helpers'

      - publish: $(Build.ArtifactStagingDirectory)/upgrade-tools
        displayName: 'Publish upgrade helper artifacts'
        artifact: 'upgrade-tools-$(Agent.OS)'

      - task: PublishBuildArtifacts@1
        displayName: 'Publish artifacts'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/nuget'
          ArtifactName: 'nuget'
          publishLocation: 'Container'

      - script: 'echo 1>&2'
        failOnStderr: true
        displayName: 'If above is partially succeeded, then fail'
        condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')
