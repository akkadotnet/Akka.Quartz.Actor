# Pull request validation for Windows and Linux against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - master

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, master ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
- template: azure-pipeline.template.yaml
  parameters:
    name: Windows
    vmImage: 'windows-latest'
    displayName: 'Windows PR Validation'

# This is the Azure DevOps PR-validation entry point. Linux supplies Docker for the
# SQL Server and PostgreSQL migration tests, which the Windows job excludes.
- template: azure-pipeline.template.yaml
  parameters:
    name: Linux
    displayName: 'Linux PR Validation'
    vmImage: 'ubuntu-latest'
