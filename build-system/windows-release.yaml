# Release task for Akka.Quartz.Actor
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference

trigger:
  branches:
    include:
      - refs/tags/*
pr: none

variables:
  - group: nugetKeys
  - name: githubConnectionName
    value: AkkaDotNet_Releases
  - name: projectName
    value: Akka.Quartz.Actor
  - name: githubRepositoryName
    value: akkadotnet/Akka.Quartz.Actor

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: ReleaseValidation
      displayName: 'Validate tagged revision including SQL Server and PostgreSQL migrations'
      vmImage: ubuntu-latest

  - job: Release
    dependsOn: ReleaseValidation
    pool:
      vmImage: windows-2022
      demands: Cmd
    steps:
      - task: UseDotNet@2
        displayName: 'Use .NET SDK from global.json'
        inputs:
          useGlobalJson: true

      - powershell: ./build.ps1
        displayName: 'Update Release Notes'

      - powershell: ./scripts/assertReleaseTag.ps1
        displayName: 'Validate release tag matches package version'

      # Pack without version suffix for release
      - script: dotnet pack -c Release -o $(Build.ArtifactStagingDirectory)/nuget
        displayName: 'Create packages'

      - pwsh: |
          ./scripts/publishUpgradeTools.ps1 -OutputDirectory "$(Build.ArtifactStagingDirectory)/upgrade-tools"
          Compress-Archive -Path "$(Build.ArtifactStagingDirectory)/upgrade-tools/*" -DestinationPath "$(Build.ArtifactStagingDirectory)/quartz-upgrade-tools.zip" -Force
        displayName: 'Create standalone upgrade helper archive'

      - script: dotnet nuget push "$(Build.ArtifactStagingDirectory)\nuget\*.nupkg" --api-key $(nugetKey) --source https://api.nuget.org/v3/index.json --skip-duplicate
        displayName: 'Publish to NuGet.org'

      - powershell: |
          $content = Get-Content RELEASE_NOTES.md -Raw
          if ($content -match '(?s)(####.+?)(?=\n####|\z)') {
            $Matches[1].Trim() | Set-Content RELEASE_NOTES_LATEST.md
          } else {
            $content | Set-Content RELEASE_NOTES_LATEST.md
          }
        displayName: 'Extract latest release notes'

      - task: GitHubRelease@0
        displayName: 'GitHub release (create)'
        inputs:
          gitHubConnection: $(githubConnectionName)
          repositoryName: $(githubRepositoryName)
          title: '$(projectName) v$(Build.SourceBranchName)'
          releaseNotesFile: 'RELEASE_NOTES_LATEST.md'
          isPreRelease: $(QuartzReleaseIsPrerelease)
          assets: |
            $(Build.ArtifactStagingDirectory)/nuget/*.nupkg
            $(Build.ArtifactStagingDirectory)/quartz-upgrade-tools.zip
